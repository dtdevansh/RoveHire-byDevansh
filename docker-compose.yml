services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rove-hire-api
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
